<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- All texts are expected to be blue. -->
  <style>
    .red { fill: #f00 }
    .blue { fill: #00f }
  </style>
  <g font-family="Droid Sans" font-size="14" font-weight="bold">
    <g style="fill: #f00">
      <g fill="#00f">
        <text x="2" y="14">Abcd</text>
      </g>
    </g>
    <g fill="#f00">
      <g style="fill: #00f">
        <text x="2" y="30">Abcd</text>
      </g>
    </g>
    <g style="fill: #f00">
      <g class="blue">
        <text x="2" y="46">Abcd</text>
      </g>
    </g>
    <g class="red">
      <g fill="#00f">
        <text x="2" y="62">Abcd</text>
      </g>
    </g>
  </g>
</svg>
