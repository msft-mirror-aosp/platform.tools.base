apply plugin: 'com.android.tools.java-library'
apply plugin: 'com.android.tools.kotlin'
apply plugin: 'com.android.tools.publish'
apply from: '../release_version.gradle'

group = 'com.android.tools.backup'

dependencies {
    implementation libs.junit_platform_commons
    implementation(project(":base:backup-test:backup-test-api"))
    implementation libs.junit
    testImplementation libs.kotlin_test
}

sourceSets {
    main.resources.srcDir 'src/main/java'
    test.resources.srcDir 'src/test/java'
}

project.ext.pomName = 'android-backup-runner'
project.ext.pomDesc = 'JUnit4 test runner for backup and restore testing'
