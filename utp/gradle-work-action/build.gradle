apply plugin: 'com.android.tools.java-library'
apply plugin: 'com.android.tools.kotlin'
apply plugin: 'com.android.tools.publish'

group = 'com.android.tools.utp'
version = rootProject.ext.baseVersion

dependencies {
    compileOnly gradleApi()
    compileOnly project(':base:utp:gradle-work-action-api')
    implementation libs.com.android.tools.common
    implementation libs.com.android.tools.ddms.ddmlib
    implementation libs.apache_commons_io
    implementation libs.junit_platform_launcher
    implementation libs.junit_platform_engine
    implementation libs.android_test_engine
    implementation libs.android_test_engine_result_listener
    implementation libs.android_test_result_proto
    implementation libs.protobuf

    testImplementation gradleApi()
    testImplementation project(':base:utp:gradle-work-action-api')
    testImplementation libs.junit
    testImplementation libs.truth
    testImplementation libs.kotlin_test
    testImplementation libs.mockito_core
    testImplementation libs.mockito_kotlin
    testImplementation libs.com.android.tools.testutils
}

project.ext.pomName = 'UTP Gradle Work Action'
project.ext.pomDesc = 'Provides Gradle WorkAction implementations for executing the Unified Test Platform (UTP) in isolation.'

jar {
    from('NOTICE')
}
