/**
 * Create a zip archive of the local repository containing artifacts for UTP.
 *
 * It depends on the `publish` tasks of all subprojects
 * (except 'gradle-work-action-api') to ensure that all necessary
 * artifacts are present in the local repository before zipping begins.
 */
tasks.register('zipUtp', Zip) {
    it.from(project(':base').localRepo)
    it.destinationDirectory = project(':base').androidHostDist
    it.archiveFileName = "repo.zip"
    it.dependsOn subprojects.findAll { subproject ->
        // Exclude "gradle-work-action-api" because it is included in
        // "//tools/base/build-system:android_gradle_plugin" output.
        subproject.name != 'gradle-work-action-api'
    }.collect { subproject ->
        subproject.tasks.findByName('publish')
    }.findAll { it != null }
}
