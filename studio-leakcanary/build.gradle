buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.2'
    }
}

apply plugin: 'com.android.library'

repositories {
    google()
    mavenCentral()
}

// Load version from the shared .bzl file
def versionProperties = new Properties()
file("release_version.bzl").withReader { versionProperties.load(it) }

// Set the project-wide version (always DEV for local Gradle development)
project.version = versionProperties.getProperty('STUDIO_LEAKCANARY_VERSION_DEV').replaceAll('"', '').trim()

android {
    namespace 'com.android.tools.studio.leakcanary'
    compileSdkVersion 34

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName project.version
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // No compile-time dependencies.
}
