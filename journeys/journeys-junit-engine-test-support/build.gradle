plugins {
    id 'com.android.tools.java-library'
    id 'com.android.tools.kotlin'
    id 'com.android.tools.publish'
}

group = 'com.android.tools.journeys'

apply from: '../release_version.gradle'

project.ext.pomName = 'Mock service for running journeys integration test'
project.ext.pomDesc = 'Provides fake service for running Journeys integration test'

dependencies {
    compileOnly project(':base:journeys:journeys-junit-engine')
    implementation "com.google.android.appcrawler:appcrawler-platform:$project.ext.appcrawlerVersion"
    implementation 'io.grpc:grpc-inprocess:1.69.1'
}

tasks.register('zipRepo', Zip) {
    it.from(project(':base').localRepo)
    it.destinationDirectory = project(':base').androidHostDist
    it.archiveFileName = "repo.zip"
    it.dependsOn('publish')
}
