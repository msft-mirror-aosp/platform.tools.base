apply plugin: 'com.android.tools.java-library'
apply plugin: 'com.android.tools.publish'
apply plugin: 'com.google.protobuf'

group = 'com.android.tools.test'
version = '1.0.0'

project.ext.pomName = 'Android On-the-fly Coverage Runtime'
project.ext.pomDesc = 'Runtime component for on-the-fly code coverage'

dependencies {
    implementation libs.protobuf
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
        proto {
            srcDirs = ['../proto']
        }
    }
}

protobuf {
    protoc {
        artifact = libs.proto_compiler
    }
    generateProtoTasks {
        all().each { task ->
            task.builtins {
                java {}
            }
        }
    }
}
