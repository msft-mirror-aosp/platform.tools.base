syntax = "proto3";

package google.testing.platform.proto.api.core;

import "proto/api/core/issue.proto";
import "proto/api/core/platform_error.proto";
import "proto/api/core/test_artifact.proto";
import "proto/api/core/test_result.proto";
import "proto/api/core/test_status.proto";

option java_package = 'com.google.testing.platform.proto.api.core';
option java_outer_classname = 'TestSuiteResultProto';

// TestExecutionResult is a summary of the results of running the tests.
message TestSuiteResult {
  // Indicates the metadata for test suite
  TestSuiteMetaData test_suite_meta_data = 1;

  // Indicates the status of the test suite and whether it passed, failed or was
  // skipped etc.
  TestStatus test_status = 2;

  // A collection of TestResult messages generated while running the test.
  repeated TestResult test_result = 3;

  // The PlatformError if the testing platform itself crashed.
  PlatformError platform_error = 4;

  // Screenshots, videos, and other data produced by this test suite that is not
  // specific to any test case.
  repeated Artifact output_artifact = 5;

  // Issues observed while running the test.
  repeated Issue issue = 6;
}

// Metadata for TestSuiteResult
message TestSuiteMetaData {
  // Name of the testSuite e.g. com.javatests.foo.bar
  string test_suite_name = 1;

  // Number of test cases scheduled to be run.
  int32 scheduled_test_case_count = 2;

  // google.testing.platform.proto.api.config.DeviceId device = 3;
  reserved 3;
}
