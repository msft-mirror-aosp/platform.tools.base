syntax = "proto3";

package google.testing.platform.proto.api.core;

option java_package = 'com.google.testing.platform.proto.api.core';
option java_outer_classname = 'TestStatusProto';

// Test status of a test suite or test case
enum TestStatus {
  TEST_STATUS_UNSPECIFIED = 0;
  STARTED = 1;
  // Actual test suite/case ran successfully but there were tests that failed.
  FAILED = 2;
  // Actual test suite/case ran successfully and all the tests passed.
  PASSED = 3;
  // Assumption failure or test was filtered intentionally.
  IGNORED = 4;
  // There was an error executing the test. This could be because of a user
  // configuration issue, an infrastructure issue or other. This should
  // always be accompanied by a platform error that describes the error.
  ERROR = 5;
  // Test was cancelled externally (e.g. SIGTERM) after it had started running.
  ABORTED = 6;
  // Similar to IGNORED, but this Test was supposed to be run and did not get a
  // chance to due to some internal state (e.g. irrecoverable infra errors,
  // infra timeouts, or cancellation before the test was started).
  CANCELLED = 7;
  // Optional status, If setup and teardown was done, but a test determined it
  // should be ignored at runtime.
  // For TestSuiteResults, this occurs when no test results were found or all
  // results were SKIPPED/IGNORED.
  SKIPPED = 8;
  // Mostly useful for a test suite result. The test suite has not finished
  // running, and the suite result only contains part of the test results.
  IN_PROGRESS = 9;
}
