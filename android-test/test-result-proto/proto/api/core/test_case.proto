syntax = "proto3";

package google.testing.platform.proto.api.core;

import "google/protobuf/timestamp.proto";

option java_package = 'com.google.testing.platform.proto.api.core';
option java_outer_classname = 'TestCaseProto';

// Represents a test case
message TestCase {
  // Test case class name, e.g.: FooTest
  string test_class = 1;
  // Test case class name, e.g.: com.bar.foo
  string test_package = 2;
  // test case method name, e.g.: testFoo
  string test_method = 3;
  // annotations found on the class
  repeated Annotation test_class_annotation = 4;
  // annotations found on the method.
  repeated Annotation test_method_annotation = 5;
  // Start time of test case
  google.protobuf.Timestamp start_time = 6;
  // End time of test case
  google.protobuf.Timestamp end_time = 7;

  // google.testing.platform.proto.api.config.DeviceId device = 8;
  reserved 8;
}

// Types for annotation values.
enum Type {
  DEFAULT = 0;
  BOOL = 1;
  CLASS = 2;
  DOUBLE = 3;
  ENUM = 4;
  INTEGER = 5;
  LONG = 6;
  STRING = 7;
  METHOD = 8;  // ANDROID SYSTEM ANNO ONLY
  FIELD = 9;   // ANDROID SYSTEM ANNO ONLY
  FLOAT = 20;
  CHAR = 12;
  SHORT = 13;
  BYTE = 14;
  NULL = 15;
  ANNOTATION = 16;
}

// Holds test annotation values.
message AnnotationValue {
  // Field name of the annotation item.
  string field_name = 1;
  // Field value of the annotation item.
  repeated string field_value = 2;
  // Field type of the annotation item.
  Type field_type = 3;
  // Is this annotation value an array (of values)?
  bool is_array = 4;
  // Special case when field_type == annotation.
  repeated Annotation field_annotation_value = 6;
}

// Holds test java annotations.
message Annotation {
  // Class of annotation.
  string class_name = 1;
  // Annotation values.
  repeated AnnotationValue annotation_value = 2;
}
