apply plugin: 'com.android.tools.java-library'
apply plugin: 'com.android.tools.kotlin'
apply plugin: 'com.android.tools.publish'
apply plugin: 'com.android.tools.metalava'

configurations {
    compileOnlyForJavadoc {
        extendsFrom(configurations.compileOnly)
    }
    dependencyScope("runtimeElementsOnly")
    runtimeElements {
        extendsFrom runtimeElementsOnly
    }
}

dependencies {
    api project(':base:build-system:gradle-common-api')
    implementation project(':base:builder-test-api')
    implementation libs.guava
    implementation libs.kotlin.stdlib
    api libs.asm
    api("org.jetbrains.kotlin:kotlin-gradle-plugin-api") {
        version {
            prefer(libs.versions.defaultKgp.get())
            reject("(,${libs.versions.kotlin.get()})")
        }
        because("AGP requires Kotlin Gradle plugin ${libs.versions.kotlin.get()} or newer. "
                + "Run './gradlew buildEnvironment' to find the plugin that requests an older version, "
                + "then upgrade that plugin or declare a newer Kotlin Gradle plugin version.")
    }

    // AGP must compile and unit test against the minimum supported KGP, not the default
    // published above. `strictly` fails the build if anything moves these classpaths to a newer
    // KGP. Strict versions on compileOnly/testImplementation are not published.
    compileOnly("org.jetbrains.kotlin:kotlin-gradle-plugin-api") { version { strictly(libs.versions.kotlin.get()) } }
    compileOnly libs.com.android.tools.annotations
    compileOnly gradleApi()
    compileOnly project(':base:builder-model') // Only present for legacy reasons.

    // Allow gradle-api to exist without gradle-core
    // for use in various partial builds modeled in the Android Studio
    // bazel build
    if (file('../gradle-core/build.gradle').isFile()) {
        runtimeElementsOnly project(':base:build-system:gradle-core')
    }
    metalavaTestImplementation libs.com.android.tools.testutils
    metalavaTestImplementation libs.guava
    metalavaTestImplementation libs.junit
    metalavaTestImplementation libs.kotlin.test

    testImplementation libs.junit
    testImplementation libs.kotlin.test
    testImplementation("org.jetbrains.kotlin:kotlin-gradle-plugin") { version { strictly(libs.versions.kotlin.get()) } }
    testImplementation("org.jetbrains.kotlin:kotlin-gradle-plugin-api") { version { strictly(libs.versions.kotlin.get()) } }
    testImplementation libs.com.android.tools.testutils
    testImplementation gradleApi()
    testImplementation project(':base:builder-model')
    testImplementation libs.com.android.tools.annotations
    testImplementation libs.com.android.tools.common
    testImplementation libs.com.android.tools.sdkCommon
    testImplementation libs.mockito.core
    testImplementation libs.equalsverifier
    testImplementation libs.truth
    // Allow gradle-api to exist without aapt2-proto.
    if (file('../aapt2-proto/build.gradle').isFile()) {
        // Dependency to aapt2-proto so Gradle can substitute the maven
        // dependency via sdk-common (built with bazel) with the Gradle
        // project for aapt2-proto when running from Gradle (not bazel)
        testRuntimeOnly project(':base:build-system:aapt2-proto')
    }
}

javadoc {
  classpath += configurations.compileOnlyForJavadoc
}

task javadocZip(type: Zip) {
  dependsOn javadoc
  from javadoc.destinationDir
  archiveBaseName.set('javadoc')
}

group = 'com.android.tools.build'
version = rootProject.ext.buildVersion

base {
    archivesName.set("gradle-api")
}

project.ext.pomName = 'Android Gradle API'
project.ext.pomDesc = 'APIs to customize Android Gradle Builds'

def updateDeprecatedApi = tasks.register('updateDeprecatedApi', JavaExec) {
    classpath(sourceSets['test'].output.classesDirs, sourceSets['test'].runtimeClasspath)
    mainClass = 'com.android.build.api.DeprecatedApiUpdater'
}

def updateIncubatingApi = tasks.register('updateIncubatingApi', JavaExec) {
    classpath(sourceSets['test'].output.classesDirs, sourceSets['test'].runtimeClasspath)
    mainClass = 'com.android.build.api.IncubatingApiUpdater'
}

def updateApi = tasks.register('updateApi') {
    dependsOn('updateMetalavaApi')
    dependsOn(updateDeprecatedApi)
    dependsOn(updateIncubatingApi)
}

tasks.jar {
    // Set the version of the plugin in the manifest. This is used by the kotlin-android-extensions
    // plugin (and maybe other 3rd party plugins).
    manifest.attributes("Plugin-Version": version)
}
