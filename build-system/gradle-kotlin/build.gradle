plugins {
    id 'com.android.tools.java-library'
    id 'com.android.tools.kotlin'
    id 'com.android.tools.publish'
    id 'java-gradle-plugin'
    id 'license-report'
    id 'jvm-toolchains'
}

gradlePlugin {
    plugins {
        comAndroidKotlinSupport {
            id = "com.android.built-in-kotlin"
            implementationClass = "com.android.build.gradle.AndroidKotlinPlugin"
        }
        // The `com.android.experimental.built-in-kotlin` plugin was renamed to
        // `com.android.built-in-kotlin`, but we keep it here so it doesn't break users
        // (see b/453960410).
        comAndroidExperimentalKotlinSupport {
            id = "com.android.experimental.built-in-kotlin"
            implementationClass = "com.android.build.gradle.AndroidKotlinPlugin"
        }
        comAndroidKaptSupport {
            id = "com.android.legacy-kapt"
            implementationClass = "com.android.build.gradle.AndroidKaptPlugin"
        }
    }
}

validatePlugins {
    // Enable strict mode so we can see more warnings
    enableStricterValidation = true
}

// create an empty jar.
// Need to use a classifier to make it unique for publishing
// (since the name is specific to the artifactId)
project.tasks.register("apiJar", org.gradle.jvm.tasks.Jar) {
    from(file('NOTICE'))
    archiveClassifier.set("api")
}

// replace the api publication with the empty jar
configurations.apiElements.outgoing.artifacts.clear()
configurations.apiElements.outgoing.artifact(apiJar)

dependencies {
    implementation gradleApi()
    implementation libs.kotlin.stdlib
    implementation("org.jetbrains.kotlin:kotlin-gradle-plugin") {
        version {
            prefer(libs.versions.defaultKgp.get())
            reject("(,${libs.versions.kotlin.get()})")
        }
        because("AGP requires Kotlin Gradle plugin ${libs.versions.kotlin.get()} or newer. "
                + "Run './gradlew buildEnvironment' to find the plugin that requests an older version, "
                + "then upgrade that plugin or declare a newer Kotlin Gradle plugin version.")
    }

    // AGP must compile and unit test against the minimum supported KGP, not the default
    // published above. `strictly` fails the build if anything moves these classpaths to a newer
    // KGP. Strict versions on compileOnly/testImplementation are not published.
    compileOnly("org.jetbrains.kotlin:kotlin-gradle-plugin") { version { strictly(libs.versions.kotlin.get()) } }
    compileOnly("org.jetbrains.kotlin:kotlin-gradle-plugin-api") { version { strictly(libs.versions.kotlin.get()) } }
    testImplementation("org.jetbrains.kotlin:kotlin-gradle-plugin") { version { strictly(libs.versions.kotlin.get()) } }
    testImplementation("org.jetbrains.kotlin:kotlin-gradle-plugin-api") { version { strictly(libs.versions.kotlin.get()) } }
}

group = 'com.android.tools.build'
version = rootProject.ext.buildVersion

project.ext.pomName = 'Android Kotlin Gradle Plugin'
project.ext.pomDesc = 'Gradle plugin to register and configure Kotlin tasks for Android projects.'

