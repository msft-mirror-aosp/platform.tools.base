apply from: "../commonHeader.gradle"
buildscript { apply from: "../commonBuildScript.gradle" }

apply plugin: 'com.android.application'

android {
    namespace = "com.android.tests.basic"
    compileSdkVersion libs.versions.latestCompileSdk.get().toInteger()
    buildToolsVersion = libs.versions.buildToolsVersion.get()

    defaultConfig {
        buildConfigField "String", "FOO", "\"foo\""
        multiDexEnabled = true
        versionCode = 1
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    flavorDimensions 'foo'
    productFlavors {
        ics {
            minSdkVersion libs.versions.supportLibMinSdk.get()
        }
        lollipop {
            minSdkVersion 21
        }
  }

    buildTypes {
        debug {
            buildConfigField "String", "FOO", "\"bar\""
            resValue "string", "foo", "foo2"
        }
        proguard {
            initWith debug
            minifyEnabled true
            proguardFile file('proguard-android.txt')
        }
        r8 {
            initWith proguard
        }
    }

    buildFeatures {
        buildConfig = true
        resValues = true
    }
}

dependencies {
    androidTestImplementation "androidx.test:runner:1.4.0-alpha06"
    androidTestImplementation "androidx.test:rules:1.4.0-alpha06"
}
