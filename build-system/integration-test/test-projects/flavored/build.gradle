apply from: "../commonHeader.gradle"
buildscript { apply from: "../commonBuildScript.gradle" }

apply plugin: 'com.android.application'

android {
    namespace = "com.android.tests.flavored"
    compileSdkVersion libs.versions.latestCompileSdk.get().toInteger()
    buildToolsVersion = libs.versions.buildToolsVersion.get()

    testBuildType = "staging"

    defaultConfig {
        minSdkVersion libs.versions.supportLibMinSdk.get()
	//noinspection ExpiredTargetSdkVersion
	targetSdkVersion libs.versions.supportLibMinSdk.get()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    flavorDimensions 'foo'
    productFlavors {
        f1 {
            applicationId = "com.android.tests.flavored.f1"
            versionName = "1.0.0-f1"
            ext.buildType = "F1PROD"
        }
        f2 {
            applicationId = "com.android.tests.flavored.f2"
            versionName = "1.0.0-f2"
            ext.buildType = "F2PROD"
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix = ".debug"
            versionNameSuffix = ".D"
        }
        staging {
            applicationIdSuffix = ".staging"
            versionNameSuffix = ".S"
            signingConfig = signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig = true
    }
}

androidComponents {
    // This is not part of the test per se, it tests that adding dynamic properties on the
    // flavor declaration can be retrieved later.
    onVariants(selector().all()) { variant ->
        assert variant.productFlavors.size() == 1
        def flavorName = variant.productFlavors[0].second
        def flavorDsl = android.productFlavors.getByName(flavorName)
        def buildType = flavorDsl.ext.buildType
        if (!"F1PROD".equals(buildType)
            && !"F2PROD".equals(buildType)) {
            throw new RuntimeException("Invalid extension property value ${buildType}")
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.12'
    androidTestImplementation "androidx.test:runner:1.4.0-alpha06"
    androidTestImplementation "androidx.test:rules:1.4.0-alpha06"
}
