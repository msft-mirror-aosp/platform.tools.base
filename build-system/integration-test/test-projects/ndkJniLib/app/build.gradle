apply plugin: 'com.android.application'

import com.android.build.OutputFile;

dependencies {
    api project(':lib')

    testImplementation 'junit:junit:4.12'
    androidTestImplementation "com.android.support.test:runner:${libs.versions.testSupportLibVersion.get()}"
    androidTestImplementation "com.android.support.test:rules:${libs.versions.testSupportLibVersion.get()}"
}

// map for the version code for ABIs.
// x86 is more important because x86 devices also support arm.
// Same for mips
ext.versionCodes = ["armeabi-v7a":1, "mips":2, "x86":3, "all":0]
def defaultVersionCode = 123

android {
    namespace = "com.example.hellojni.app"
    compileSdkVersion libs.versions.latestCompileSdk.get().toInteger()
    buildToolsVersion = libs.versions.buildToolsVersion.get()

    defaultConfig {
        // This actual the app version code. Giving ourselves 100,000 values [0, 99999]
        versionCode defaultVersionCode
        minSdkVersion libs.versions.ndk19SupportLibMinSdk.get()
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }

    flavorDimensions 'version'
    productFlavors {
        gingerbread {
            minSdkVersion libs.versions.ndk19SupportLibMinSdk.get()
            versionCode = 1
        }
        icecreamSandwich {
            minSdkVersion libs.versions.ndk19SupportLibMinSdk.get()
            versionCode = 2
        }
    }

    splits {
        abi {
            enable = true
            universalApk = true
            exclude "x86_64", "mips64", "arm64-v8a", "armeabi", "riscv64"
        }
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        // make per-variant version code
        variant.outputs.forEach { output ->
	    // get the version code for the output
	    def apiVersion = output.versionCode.get()
	    // assign a composite version code for each output, based on the
	    // flavor and the abi.
	    def filter = output.getFilter(com.android.build.api.variant.FilterConfiguration.FilterType.ABI)
	    def key = filter == null ? "all" : filter.identifier
            output.versionCode.set(output.versionCode.get() * 1000000 + project.ext.versionCodes.get(key) * 100000 + defaultVersionCode)
        }
    }
}
