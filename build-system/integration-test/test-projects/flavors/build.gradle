apply from: "../commonHeader.gradle"
buildscript { apply from: "../commonBuildScript.gradle" }

apply plugin: 'com.android.application'

android {
    namespace = "com.android.tests.flavors"
    compileSdk{
        version = release(libs.versions.latestCompileSdk.get().toInteger())
    }
    buildToolsVersion = libs.versions.buildToolsVersion.get()
    defaultConfig {
        minSdk{
            version = release(libs.versions.supportLibMinSdk.get().toInteger())
        }
	targetSdk {
            version = release(libs.versions.supportLibMinSdk.get().toInteger())
	}
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    flavorDimensions   "group1", "group2"

    productFlavors {
        f1 {
            dimension   "group1"
        }
        f2 {
            dimension   "group1"
        }

        fa {
            dimension   "group2"
        }
        fb {
            dimension   "group2"
        }
    }

    buildFeatures {
        buildConfig = true
    }
}

dependencies {
    androidTestImplementation "androidx.test:runner:1.4.0-alpha06"
    androidTestImplementation "androidx.test:rules:1.4.0-alpha06"
}
