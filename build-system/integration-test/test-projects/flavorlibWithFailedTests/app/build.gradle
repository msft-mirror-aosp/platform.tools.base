apply plugin: 'com.android.application'

android {
    namespace = "com.android.tests.flavorlib.app"
    compileSdkVersion libs.versions.latestCompileSdk.get().toInteger()
    buildToolsVersion = libs.versions.buildToolsVersion.get()

    defaultConfig {
        minSdkVersion 15
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    flavorDimensions 'foo'
    productFlavors {
        flavor1 {
            applicationId = "com.android.tests.flavorlib.app.flavor1"
        }
        flavor2 {
            applicationId = "com.android.tests.flavorlib.app.flavor2"
        }
    }
}

dependencies {
    flavor1Api project(':lib1')
    flavor2Api project(':lib2')

    testImplementation 'junit:junit:4.12'
    androidTestImplementation "androidx.test:runner:1.4.0-alpha06"
    androidTestImplementation "androidx.test:rules:1.4.0-alpha06"
}
