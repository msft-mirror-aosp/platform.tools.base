apply plugin: 'com.android.library'

android {
    namespace = "com.android.tests.basic.lib"
    compileSdkVersion libs.versions.latestCompileSdk.get().toInteger()
    buildToolsVersion = libs.versions.buildToolsVersion.get()

    defaultConfig {
        versionCode 12
        versionName "2.0"
        minSdkVersion 16
        //noinspection ExpiringTargetSdkVersion,ExpiredTargetSdkVersion
        targetSdkVersion 16
        consumerProguardFiles 'config.pro'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
}

dependencies {
    // guava is intentionally defined to be compileOnly so that application using the library will
    // fail during proguard if it's not using the supplied config.pro.
    compileOnly "com.google.guava:guava:19.0"

    androidTestImplementation "androidx.test:runner:1.4.0-alpha06"
    androidTestImplementation "androidx.test:rules:1.4.0-alpha06"
    androidTestImplementation "androidx.annotation:annotation-experimental:1.3.0"
}
