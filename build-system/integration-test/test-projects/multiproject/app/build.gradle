apply plugin: 'com.android.application'

android {
    namespace = "com.example.android.multiproject"
    compileSdkVersion libs.versions.latestCompileSdk.get().toInteger()
    buildToolsVersion = libs.versions.buildToolsVersion.get()

    defaultConfig {
        minSdkVersion libs.versions.supportLibMinSdk.get()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
}

dependencies {
    api project(':library')

    implementation 'com.google.code.findbugs:jsr305:3.0.2'
    implementation 'com.google.j2objc:j2objc-annotations:1.3'
    compileOnly 'org.codehaus.mojo:animal-sniffer-annotations:1.19'

    testImplementation 'junit:junit:4.12'
    androidTestImplementation "androidx.test:runner:1.4.0-alpha06"
    androidTestImplementation "androidx.test:rules:1.4.0-alpha06"
}
