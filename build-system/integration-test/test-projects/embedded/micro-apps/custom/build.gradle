apply plugin: 'com.android.application'

android {
    namespace = "com.android.tests.basic.custom"
    compileSdkVersion libs.versions.latestCompileSdk.get().toInteger()
    buildToolsVersion = libs.versions.buildToolsVersion.get()

    defaultConfig {
        minSdkVersion libs.versions.supportLibMinSdk.get()
        versionCode 42
        versionName "custom"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        create("custom").initWith(release)
    }

}

dependencies {
    api "com.android.support:support-v4:${libs.versions.supportLibVersion.get()}"

    testImplementation 'junit:junit:4.12'
    androidTestImplementation "androidx.test:runner:1.4.0-alpha06"
    androidTestImplementation "androidx.test:rules:1.4.0-alpha06"
}
