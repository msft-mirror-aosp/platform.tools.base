apply from: "../commonHeader.gradle"
buildscript {
    apply from: "../commonHeader.gradle" // for $kotlinVersion
    apply from: "../commonBuildScript.gradle"
}
apply plugin: 'com.android.application'

configurations.all {
    // kotlin-stdlib-jdk7 and kotlin-stdlib-jdk8 are bundled in kotlin-stdlib since 1.8.0.
    // To avoid duplicate classes, we exclude them.
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    api "androidx.legacy:legacy-support-v4:1.0.0"
    api "androidx.cardview:cardview:1.0.0"
    api "androidx.appcompat:appcompat:1.7.0"
    testImplementation 'junit:junit:4.12'
    androidTestImplementation "androidx.test:runner:1.5.2"
    androidTestImplementation "androidx.test:rules:1.4.0-alpha06"
}

android {
    namespace = "com.example.android.basicrenderscript"
    compileSdkVersion libs.versions.latestCompileSdk.get().toInteger()

    buildToolsVersion libs.versions.buildToolsVersion.get()

    defaultConfig {
        applicationId "com.example.basicrenderscript"
        minSdkVersion 21
        //noinspection ExpiringTargetSdkVersion,ExpiredTargetSdkVersion
        targetSdkVersion 27
        versionCode 1
        versionName "1.0"

        renderscriptTargetApi = 28
        renderscriptSupportModeEnabled = true
        renderscriptNdkModeEnabled = true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            moduleName = "renderscript"
            stl = "c++_shared"
        }
    }

    externalNativeBuild {
        ndkBuild {
            path "Android.mk"
        }
    }

    buildFeatures {
        renderScript = true
    }
}
