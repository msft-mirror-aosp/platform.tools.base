apply from: "../commonHeader.gradle"
buildscript { apply from: "../commonBuildScript.gradle" }

apply plugin: 'com.android.application'

android {
    namespace = "com.android.tests.basic"
    compileSdkVersion libs.versions.latestCompileSdk.get().toInteger()
    buildToolsVersion libs.versions.buildToolsVersion.get()

    testBuildType = "debug"

    defaultConfig {
        versionCode 12
        versionName "2.0"
        minSdkVersion 16
        targetSdkVersion 16
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        testInstrumentationRunnerArguments "additionalTestOutputDir": "/sdcard/Download/Macrobenchmark/com.android.tests.basic.test"
    }

    lintOptions {
        // HardcodeDebugMode to test copying files from non-debuggable apks.
        abortOnError = false
    }
}

dependencies {
    api "com.android.support:support-v4:${libs.versions.supportLibVersion.get()}"
    debugApi "com.android.support:support-v13:${libs.versions.supportLibVersion.get()}"

    testImplementation 'junit:junit:4.12'
    androidTestImplementation "androidx.test:runner:1.4.0-alpha06"
    androidTestImplementation "androidx.test:rules:1.4.0-alpha06"
}

