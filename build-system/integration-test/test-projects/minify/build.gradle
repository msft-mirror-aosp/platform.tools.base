apply from: "../commonHeader.gradle"
buildscript { apply from: "../commonBuildScript.gradle" }

apply plugin: 'com.android.application'

android {
    namespace = "com.android.tests.basic"
    compileSdkVersion libs.versions.latestCompileSdk.get().toInteger()
    buildToolsVersion = libs.versions.buildToolsVersion.get()

    testBuildType = "minified"

    defaultConfig {
        versionCode 12
        versionName "2.0"
        minSdkVersion 16
        //noinspection ExpiringTargetSdkVersion,ExpiredTargetSdkVersion
        targetSdkVersion 16
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        create("minified").initWith(buildTypes.debug)
        minified {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'dont-optimize.pro'
            testProguardFile 'test-proguard-rules.pro'
            enableAndroidTestCoverage = true
            enableUnitTestCoverage = true
        }
    }

    // Included in both hamcrest-core and hamcrest-library.
    packagingOptions.exclude 'LICENSE.txt'
}

dependencies {
    testImplementation 'junit:junit:4.12'
    androidTestImplementation "androidx.test:runner:1.4.0-alpha06"
    androidTestImplementation "androidx.test:rules:1.4.0-alpha06"
    androidTestImplementation "androidx.annotation:annotation-experimental:1.3.0"

    // This library references java.beans classes that are not part of Android,
    // so ProGuard can't find references and fails without the rule from
    // test-proguard-rules.pro.
    androidTestImplementation 'org.hamcrest:hamcrest-library:1.3'
}
