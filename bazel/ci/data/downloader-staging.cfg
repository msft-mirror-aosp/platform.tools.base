# LINT.IfChange

# downloader.cfg and downloader-staging.cfg should be kept in sync.  Note that
# they are not identical.  See go/bazel-downloader-config for syntax.

# See go/airlock for more details.
# Uses the ah-3p-staging-maven repository to stage maven artifacts. If they
# pass validation checks, they are made available in the trusted repository.
rewrite repo1.maven.org/maven2/(.*) us-maven.pkg.dev/artifact-foundry-prod/ah-3p-staging-maven/$1
rewrite registry.npmjs.org/(.*) us-npm.pkg.dev/artifact-foundry-prod/npm-3p-trusted/$1

# Use a proxy to android-studio-build-deps-mirror GCS bucket as a mirror for
# external deps.  See go/studio-ci#gcs-mirror for updating mirrors in GCS.
rewrite (android.googlesource.com)/(.*) http://localhost:8080/$1/$2
# TODO(b/483119353): Migrate more domains to use GCS mirroring.

# go/keep-sorted start
allow bcr.bazel.build
allow bitbucket.org
allow dl.google.com
allow github.com
allow go.dev
allow googleapis.com
allow localhost
allow maven.google.com
allow mirror.bazel.build
allow nodejs.org
allow static.crates.io
allow static.rust-lang.org
allow us-maven.pkg.dev
allow us-npm.pkg.dev
# go/keep-sorted end

block *

# LINT.ThenChange(downloader.cfg)
