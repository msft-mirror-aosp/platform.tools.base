# Use go/airlock to mirror maven deps.
# If artifacts are not found, replace the path maven-3p-trusted/ with
# ah-3p-staging-maven/, and re-run the build. This will start the import process
# for the missing dependencies into the maven-3p-trusted repository.
rewrite repo1.maven.org/maven2/(.*) us-maven.pkg.dev/artifact-foundry-prod/maven-3p-trusted/$1
