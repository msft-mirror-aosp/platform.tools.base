# LINT.IfChange

# downloader.cfg and downloader-staging.cfg should be kept in sync.  Note that
# they are not identical.  See go/bazel-downloader-config for syntax.

# See go/airlock for more details.
rewrite repo1.maven.org/maven2/(.*) us-maven.pkg.dev/artifact-foundry-prod/maven-3p-trusted/$1
rewrite registry.npmjs.org/(.*) us-npm.pkg.dev/artifact-foundry-prod/npm-3p-trusted/$1

# Use android-studio-build-deps-mirror GCS bucket as a mirror for external deps.
#
# If a domain is listed multiple times, each of the substitute domains will be
# tried sequentially.  This allows the cache to be used in the normal case while
# leaving a fallback to be used for cache misses.
#
# See go/studio-ci#gcs-mirror for updating mirrors in GCS.
#
# TODO(b/483119353): Migrate more domains to use GCS mirroring.
# TODO(b/500818680): Mirroring won't be necessary after switching to Bazel 9 and
# using the remote repo cache feature.
rewrite (android.googlesource.com)/(.*) storage.googleapis.com/android-studio-build-deps-mirror/$1/$2
rewrite (github.com)/(.*) storage.googleapis.com/android-studio-build-deps-mirror/$1/$2
rewrite (github.com)/(.*) $1/$2

# go/keep-sorted start
allow bcr.bazel.build
allow bitbucket.org
allow cache-redirector.jetbrains.com
allow dl.google.com
allow download.jetbrains.com
allow github.com
allow go.dev
allow googleapis.com
allow maven.google.com
allow mirror.bazel.build
allow nodejs.org
allow packages.jetbrains.team
allow static.crates.io
allow static.rust-lang.org
allow us-maven.pkg.dev
allow us-npm.pkg.dev
# go/keep-sorted end

block *

# LINT.ThenChange(downloader-staging.cfg)
