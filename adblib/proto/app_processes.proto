 // This proto definition is copied from packages/modules/adb/proto/app_processes.proto

 syntax = "proto3";
 option java_package = "com.android.server.adb.protos";
 option java_outer_classname = "AppProcessesProto";
 package adb.proto;
 message ProcessEntry {
    /**
     * The process ID of the process the device
     */
     int64 pid = 1;

    /**
     * Whether a JDWP debugger can attach to the process
     */
     bool debuggable = 2;

    /**
     * Whether profiling tools can profile the process
     */
     bool profileable = 3;

    /**
     * The Android ABI the process is executing with, as defined at
     * [abis](https://developer.android.com/ndk/guides/abis).
     * Examples: "arm64-v8a", "x86_64"
     */
     string architecture = 4;

    /**
     * The Android User ID
     *
     * Note: Only ever set if the `app_info` feature is supported by the device (API 36+)
     * See https://android-review.googlesource.com/q/topic:%22app_info%22
     */
     optional int64  user_id = 5;

    /**
     * The process name
     *
     * Note: Only ever set if the `app_info` feature is supported by the device (API 36+)
     * See https://android-review.googlesource.com/q/topic:%22app_info%22
     */
     optional string process_name = 6;

    /**
     * The list of packages this process hosts, typically only one for "regular"
     * Android Applications
     *
     * Note: Only ever set if the `app_info` feature is supported by the device (API 36+)
     * See https://android-review.googlesource.com/q/topic:%22app_info%22
     */
     repeated string package_names = 7;

    /**
     * Whether the JDWP process is waiting for a JDWP debugger to attach
     *
     * Note: Only ever set if the `app_info` feature is supported by the device (API 36+)
     * See https://android-review.googlesource.com/q/topic:%22app_info%22
     */
     optional bool waiting_for_debugger = 8;

    /**
     * The Android `uid`, i.e. the results of calling `getuid()` in the process.
     * The `uid` is a unique identifier for a given [user ID][userId] and
     * [package name][packageNames], i.e. 2 packages with the same name but different
     * [userId] values with have different [uid] values.
     *
     * Note: Only ever set if the `app_info` feature is supported by the device (API 36+)
     * See https://android-review.googlesource.com/q/topic:%22app_info%22
     */
     optional int64 uid = 9;
 }
 message AppProcesses {
   repeated ProcessEntry process = 1;
 }
